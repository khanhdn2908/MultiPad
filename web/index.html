<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Màu thanh địa chỉ trên điện thoại, khớp nền trang -->
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MultiPad</title>
    <script>
      // Áp theme đã chọn trước khi render để không bị nháy màu
      try {
        const t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          for (const m of document.querySelectorAll('meta[name="theme-color"]'))
            m.setAttribute('content', t === 'dark' ? '#161616' : '#f4f3ef')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
